<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Chronical AI</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ececec;
            --text-muted: #8e8ea0;
            --user-text-color: #8ab4f8;
            --accent-color: #8ab4f8;
            --code-bg: #111113;
            --font-base: clamp(0.88rem, 1vw + 0.5rem, 1.3rem);
            --font-header: clamp(1rem, 1.2vw + 0.6rem, 1.55rem);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        button:focus-visible, textarea:focus-visible, select:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        .main-container {
            width: 100%;
            max-width: 920px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--bg-color);
        }

        .chat-header {
            padding: clamp(14px, 1.8vh, 24px) clamp(16px, 2vw, 28px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-title {
            font-size: var(--font-header);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, #8ab4f8, #c58af9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mode-select, .clear-btn {
            background-color: #121214;
            border: none;
            color: var(--text-muted);
            padding: clamp(6px, 0.6vh, 8px) clamp(10px, 1.2vw, 16px);
            border-radius: 16px;
            font-size: calc(var(--font-base) * 0.78);
            cursor: pointer;
            transition: color 0.2s, background 0.2s;
            appearance: none;
            -webkit-appearance: none;
        }

        .mode-select:hover, .clear-btn:hover {
            background-color: #1e1e22;
            color: var(--text-color);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: clamp(12px, 2vw, 28px) clamp(16px, 2vw, 28px);
            display: flex;
            flex-direction: column;
            gap: clamp(18px, 2.2vh, 28px);
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #222;
            border-radius: 10px;
        }

        .message {
            max-width: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            line-height: 1.65;
            font-size: var(--font-base);
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-items: flex-end;
        }

        .message.bot {
            align-items: flex-start;
        }

        .message-content {
            background: transparent;
            padding: 0;
            width: 100%;
            word-wrap: break-word;
            overflow-wrap: anywhere;
        }

        .message.user .message-content {
            color: var(--user-text-color);
            max-width: 85%;
            width: auto;
            text-align: right;
            font-weight: 500;
        }

        /* Formatação rica dentro das respostas da IA */
        .message-content p {
            margin-bottom: 0.75em;
        }
        .message-content p:last-child {
            margin-bottom: 0;
        }
        .message-content ul, .message-content ol {
            margin: 0.5em 0 0.75em 1.4em;
        }
        .message-content li {
            margin-bottom: 0.35em;
        }
        .message-content h1, .message-content h2, .message-content h3 {
            margin: 0.8em 0 0.4em;
            color: #ffffff;
            font-weight: 600;
        }
        .message-content code {
            background-color: #18181b;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
            color: #a8c7fa;
        }

        .code-wrapper {
            background-color: var(--code-bg);
            border-radius: 10px;
            margin: 0.8em 0;
            overflow: hidden;
        }
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 14px;
            background-color: #18181c;
            font-size: 0.75em;
            color: var(--text-muted);
        }
        .copy-code-btn {
            background: transparent;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            font-size: 0.85em;
        }
        .code-wrapper pre {
            padding: 12px 14px;
            overflow-x: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.88em;
            line-height: 1.45;
            color: #e3e3e3;
        }

        .msg-actions {
            margin-top: 6px;
            display: flex;
            gap: 10px;
            opacity: 0.55;
            transition: opacity 0.2s;
        }
        .message.bot:hover .msg-actions {
            opacity: 1;
        }
        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.75em;
            cursor: pointer;
            padding: 2px 4px;
        }
        .action-btn:hover {
            color: var(--text-color);
        }

        /* Sugestões iniciais */
        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 clamp(16px, 2vw, 28px) 10px;
        }
        .suggestion-chip {
            background-color: #121214;
            border: none;
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 18px;
            font-size: calc(var(--font-base) * 0.8);
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .suggestion-chip:hover {
            background-color: #1e1e22;
            color: var(--text-color);
        }

        /* Área de digitação totalmente integrada na tela */
        .input-container {
            width: 100%;
            background-color: var(--bg-color);
            padding: clamp(10px, 1.5vh, 20px) clamp(16px, 2vw, 28px);
            padding-bottom: max(clamp(12px, 1.8vh, 22px), env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            flex-shrink: 0;
        }

        .input-box {
            width: 100%;
            background-color: transparent;
            display: flex;
            align-items: flex-end;
            padding: 0;
            border: none;
            gap: 12px;
        }

        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: var(--font-base);
            resize: none;
            outline: none;
            max-height: 140px;
            padding: 8px 0;
            line-height: 1.45;
        }

        .input-box textarea::placeholder {
            color: #5e5e66;
        }

        .send-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            width: clamp(34px, 2.8vw, 44px);
            height: clamp(34px, 2.8vw, 44px);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: var(--font-base);
            flex-shrink: 0;
            transition: opacity 0.2s, transform 0.1s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        .send-btn:active {
            transform: scale(0.94);
        }

        /* Indicador de pensamento pulsante */
        .thinking {
            color: var(--text-muted);
            font-style: italic;
            animation: pulse 1.4s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Smartwatch e telas ultra-pequenas */
        @media (max-width: 320px) {
            .chat-header { padding: 8px 10px; }
            .mode-select, .suggestions { display: none !important; }
            .chat-messages { padding: 8px 10px; gap: 12px; }
            .message-content { font-size: 0.8rem; }
            .input-container { padding: 6px 10px; }
            .input-box textarea { font-size: 0.8rem; padding: 4px 0; }
            .send-btn { width: 28px; height: 28px; }
        }

        /* Smart TVs e monitores 4K */
        @media (min-width: 1600px) {
            .main-container { max-width: 1200px; }
            .chat-messages { padding: 36px 48px; gap: 30px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="chat-header">
            <div class="brand">
                <span class="brand-title">Chronical AI</span>
            </div>
            <div class="header-controls">
                <select id="modeSelect" class="mode-select" aria-label="Estilo de resposta">
                    <option value="equilibrado">Equilibrada</option>
                    <option value="criativo">Criativa</option>
                    <option value="direto">Direta</option>
                </select>
                <button class="clear-btn" onclick="resetChat()">Nova conversa</button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-content">Olá, João! Sou a <strong>Chronical</strong>. Posso ajudar você a criar códigos, escrever textos, resolver problemas ou explorar qualquer ideia hoje. Por onde começamos?</div>
            </div>
        </div>

        <div class="suggestions" id="suggestions">
            <button class="suggestion-chip" onclick="useSuggestion('Me dê 3 ideias inovadoras de aplicativos usando IA')">Ideias de apps com IA</button>
            <button class="suggestion-chip" onclick="useSuggestion('Explique computação quântica de forma simples')">Explicar um conceito</button>
            <button class="suggestion-chip" onclick="useSuggestion('Escreva um script em Python para automatizar tarefas')">Gerar código</button>
        </div>

        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" rows="1" placeholder="Pergunte qualquer coisa à Chronical..."></textarea>
                <button class="send-btn" id="sendBtn" aria-label="Enviar">↑</button>
            </div>
        </div>
    </div>

    <script>
        const k1 = "AQ.Ab8RN6KSknbzMLTioeXA";
        const k2 = "-hTIQ2MZfu20Sp49V7_bSNyJgMsIbQ";
        const API_KEY = k1 + k2;

        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const modeSelect = document.getElementById('modeSelect');
        const suggestionsBox = document.getElementById('suggestions');

        let chatHistory = [];

        const systemPrompts = {
            equilibrado: "Você é a Chronical, uma inteligência artificial moderna, versátil, perspicaz e avançada, criada por João. Você atua no mesmo nível de excelência de assistentes como Gemini e ChatGPT, ajudando em programação, escrita, análise, criatividade e dúvidas do cotidiano. Estamos em novembro de 2026. Responda em português de forma clara, bem estruturada e natural.",
            criativo: "Você é a Chronical, uma inteligência artificial altamente criativa, imaginativa e inspiradora, criada por João. Estamos em novembro de 2026. Traga ideias originais, metáforas inteligentes e soluções fora da caixa, mantendo clareza e elegância.",
            direto: "Você é a Chronical, uma inteligência artificial objetiva, técnica e ultra-eficiente, criada por João. Estamos em novembro de 2026. Vá direto ao ponto sem rodeios, entregando respostas precisas, práticas e bem formatadas."
        };

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 140) + 'px';
        });

        function useSuggestion(text) {
            userInput.value = text;
            handleSend();
        }

        function resetChat() {
            chatHistory = [];
            chatMessages.innerHTML = `
                <div class="message bot">
                    <div class="message-content">Conversa reiniciada. Como a <strong>Chronical</strong> pode ajudar agora, João?</div>
                </div>
            `;
            if (suggestionsBox) suggestionsBox.style.display = 'flex';
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        function formatMarkdown(text) {
            // Protege blocos de código ```linguagem ... ```
            const codeBlocks = [];
            text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
                const idx = codeBlocks.length;
                const safeCode = escapeHtml(code.trim());
                const languageLabel = lang || 'código';
                codeBlocks.push(`
                    <div class="code-wrapper">
                        <div class="code-header">
                            <span>${languageLabel}</span>
                            <button class="copy-code-btn" onclick="copyCode(this)">Copiar</button>
                        </div>
                        <pre><code>${safeCode}</code></pre>
                    </div>
                `);
                return `___CODEBLOCK_${idx}___`;
            });

            // Escapa HTML restante
            text = escapeHtml(text);

            // Código inline `...`
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Títulos ###, ##, #
            text = text.replace(/^### (.*$)/gm, '<h3>$1</h3>');
            text = text.replace(/^## (.*$)/gm, '<h2>$1</h2>');
            text = text.replace(/^# (.*$)/gm, '<h1>$1</h1>');

            // Negrito e itálico
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');

            // Listas simples
            text = text.replace(/^\s*[-*]\s+(.*)$/gm, '<li>$1</li>');
            text = text.replace(/(<li>.*<\/li>\n?)+/g, match => `<ul>${match}</ul>`);

            // Quebras de linha em parágrafos
            text = text.split(/\n\n+/).map(p => {
                if (p.startsWith('<h') || p.startsWith('<ul>') || p.startsWith('___CODEBLOCK_')) return p;
                return `<p>${p.replace(/\n/g, '<br>')}</p>`;
            }).join('');

            // Restaura blocos de código
            codeBlocks.forEach((block, idx) => {
                text = text.replace(`___CODEBLOCK_${idx}___`, block);
            });

            return text;
        }

        window.copyCode = function(btn) {
            const code = btn.closest('.code-wrapper').querySelector('code').innerText;
            navigator.clipboard.writeText(code);
            btn.innerText = 'Copiado!';
            setTimeout(() => btn.innerText = 'Copiar', 1800);
        };

        window.copyText = function(btn, rawText) {
            navigator.clipboard.writeText(decodeURIComponent(rawText));
            btn.innerText = 'Copiado';
            setTimeout(() => btn.innerText = 'Copiar', 1800);
        };

        function addMessage(text, sender, id = null, isThinking = false) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            if (id) messageDiv.id = id;

            if (isThinking) {
                messageDiv.innerHTML = `<div class="message-content thinking">${text}</div>`;
            } else if (sender === 'bot') {
                const formatted = formatMarkdown(text);
                const encoded = encodeURIComponent(text);
                messageDiv.innerHTML = `
                    <div class="message-content">${formatted}</div>
                    <div class="msg-actions">
                        <button class="action-btn" onclick="copyText(this, '${encoded}')">Copiar</button>
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `<div class="message-content">${escapeHtml(text).replace(/\n/g, '<br>')}</div>`;
            }

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageDiv;
        }

        // Efeito fluido de exibição progressiva da resposta
        async function streamResponse(fullText) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', 'bot');
            const contentDiv = document.createElement('div');
            contentDiv.classList.add('message-content');
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);

            const words = fullText.split(' ');
            let current = '';
            const step = Math.max(1, Math.floor(words.length / 45));

            for (let i = 0; i < words.length; i += step) {
                current += (i === 0 ? '' : ' ') + words.slice(i, i + step).join(' ');
                contentDiv.innerHTML = formatMarkdown(current);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                await new Promise(r => setTimeout(r, 18));
            }

            contentDiv.innerHTML = formatMarkdown(fullText);
            const encoded = encodeURIComponent(fullText);
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'msg-actions';
            actionsDiv.innerHTML = `<button class="action-btn" onclick="copyText(this, '${encoded}')">Copiar</button>`;
            messageDiv.appendChild(actionsDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            if (suggestionsBox) suggestionsBox.style.display = 'none';

            addMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';

            const loadingId = 'loading-' + Date.now();
            addMessage('Chronical está pensando...', 'bot', loadingId, true);

            chatHistory.push({
                role: "user",
                parts: [{ text: text }]
            });

            const selectedMode = modeSelect.value;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        systemInstruction: {
                            parts: [{ text: systemPrompts[selectedMode] }]
                        },
                        contents: chatHistory
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId)?.remove();

                if (data.error) {
                    addMessage(`Erro da API: ${data.error.message}`, 'bot');
                    chatHistory.pop();
                    return;
                }

                const botReply = data.candidates[0].content.parts[0].text;
                await streamResponse(botReply);

                chatHistory.push({
                    role: "model",
                    parts: [{ text: botReply }]
                });

            } catch (error) {
                document.getElementById(loadingId)?.remove();
                addMessage('Erro de conexão. Verifique sua internet e tente novamente.', 'bot');
                chatHistory.pop();
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
