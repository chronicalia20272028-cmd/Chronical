
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronical - Assistente de IA</title>
    <style>
        :root {
            --bg-color: #131314;
            --sidebar-color: #1e1f20;
            --chat-bg: #1e1f20;
            --input-bg: #2b2c2f;
            --text-color: #e3e3e3;
            --text-secondary: #c4c7c5;
            --accent-color: #8ab4f8;
            --user-bubble: #004a77;
            --bot-bubble: #2b2c2f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Barra Lateral */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-color);
            display: flex;
            flex-direction: column;
            padding: 15px;
            border-right: 1px solid #333;
        }

        .new-chat-btn {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: none;
            padding: 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background-color: #38393c;
        }

        .sidebar-title {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Área Principal do Chat */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        .chat-header {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            border-bottom: 1px solid #333;
            background-color: var(--bg-color);
            color: var(--accent-color);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 120px;
        }

        .message {
            max-width: 750px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            gap: 20px;
            line-height: 1.6;
            font-size: 1rem;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            background-color: var(--bot-bubble);
            padding: 15px 20px;
            border-radius: 12px;
            width: 100%;
        }

        .message.user .message-content {
            background-color: var(--user-bubble);
            max-width: 80%;
            border-radius: 18px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .bot-avatar {
            background-color: #8ab4f8;
            color: #131314;
        }

        /* Área de Input Fixa embaixo */
        .input-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(transparent, var(--bg-color) 40%);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .input-box {
            max-width: 800px;
            width: 100%;
            background-color: var(--input-bg);
            border-radius: 28px;
            display: flex;
            align-items: center;
            padding: 8px 16px;
            border: 1px solid #444;
        }

        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1rem;
            resize: none;
            outline: none;
            max-height: 150px;
            padding: 8px 0;
        }

        .send-btn {
            background-color: var(--accent-color);
            color: #131314;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Barra Lateral Estilo ChatGPT / Gemini -->
    <div class="sidebar">
        <button class="new-chat-btn" onclick="location.reload()">+ Novo Chat</button>
        <div class="sidebar-title">Histórico Recente</div>
        <div style="font-size: 0.90rem; color: var(--text-secondary); padding: 5px;">Projeto Integrado II</div>
    </div>

    <!-- Tela Principal -->
    <div class="main-container">
        <div class="chat-header">Chronical AI</div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="avatar bot-avatar">C</div>
                <div class="message-content">
                    Olá, João! Eu sou a <strong>Chronical</strong>, sua inteligência artificial desenvolvida para o seu Projeto Integrado II. Como posso ajudar na construção do seu sistema hoje?
                </div>
            </div>
        </div>

        <!-- Caixa de Digitação -->
        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" rows="1" placeholder="Envie uma mensagem para a Chronical..."></textarea>
                <button class="send-btn" id="sendBtn">↑</button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);

            if (sender === 'bot') {
                messageDiv.innerHTML = `
                    <div class="avatar bot-avatar">C</div>
                    <div class="message-content">${text}</div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="message-content">${text}</div>
                `;
            }

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';

            // Resposta interativa direta no navegador
            setTimeout(() => {
                addMessage("Compreendido, João! A estrutura está pronta, limpa e funcional para a sua apresentação da faculdade.", 'bot');
            }, 1000);
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
