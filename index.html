<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Chronical - Assistente de IA</title>
    <style>
        :root {
            --bg-color: #131314;
            --sidebar-color: #1e1f20;
            --input-bg: #2b2c2f;
            --text-color: #e3e3e3;
            --text-secondary: #c4c7c5;
            --accent-color: #8ab4f8;
            --user-bubble: #004a77;
            --bot-bubble: #2b2c2f;
            /* Tipografia fluida que escala automaticamente da tela do relógio até a TV */
            --font-base: clamp(0.82rem, 1vw + 0.5rem, 1.35rem);
            --font-header: clamp(0.95rem, 1.2vw + 0.6rem, 1.6rem);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh; /* Garante que a barra do navegador do celular não corte o input */
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* Destaque de foco para navegação por controle remoto de TV ou teclado */
        button:focus-visible, textarea:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        .sidebar {
            width: clamp(220px, 18vw, 340px);
            background-color: var(--sidebar-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            border-right: 1px solid #333;
            flex-shrink: 0;
        }

        .new-chat-btn {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: none;
            padding: 12px 16px;
            border-radius: 24px;
            cursor: pointer;
            font-size: calc(var(--font-base) * 0.9);
            font-weight: 600;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background-color: #38393c;
        }

        .sidebar-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-width: 0;
            position: relative;
        }

        .chat-header {
            padding: clamp(10px, 1.5vh, 22px) clamp(12px, 2vw, 28px);
            font-size: var(--font-header);
            font-weight: 600;
            border-bottom: 1px solid #333;
            background-color: var(--bg-color);
            color: var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .clear-btn {
            background: none;
            border: 1px solid #444;
            color: var(--text-color);
            padding: clamp(4px, 0.6vh, 8px) clamp(10px, 1.2vw, 18px);
            border-radius: 16px;
            font-size: calc(var(--font-base) * 0.8);
            cursor: pointer;
        }

        .clear-btn:hover {
            background-color: #2b2c2f;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: clamp(10px, 2vw, 28px);
            display: flex;
            flex-direction: column;
            gap: clamp(12px, 1.8vh, 24px);
            scroll-behavior: smooth;
        }

        .message {
            max-width: min(850px, 95%);
            margin: 0 auto;
            width: 100%;
            display: flex;
            gap: clamp(8px, 1.2vw, 18px);
            line-height: 1.55;
            font-size: var(--font-base);
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            background-color: var(--bot-bubble);
            padding: clamp(10px, 1.4vw, 20px) clamp(14px, 1.8vw, 24px);
            border-radius: 14px;
            width: 100%;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: anywhere;
        }

        .message.user .message-content {
            background-color: var(--user-bubble);
            max-width: 85%;
            width: auto;
            border-radius: 18px;
        }

        .avatar {
            width: clamp(28px, 2.5vw, 44px);
            height: clamp(28px, 2.5vw, 44px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: calc(var(--font-base) * 0.9);
            flex-shrink: 0;
        }

        .bot-avatar {
            background-color: var(--accent-color);
            color: #131314;
        }

        .input-container {
            width: 100%;
            background-color: var(--bg-color);
            padding: clamp(8px, 1.2vh, 18px) clamp(10px, 2vw, 24px);
            padding-bottom: max(clamp(8px, 1.2vh, 18px), env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            flex-shrink: 0;
            border-top: 1px solid #222;
        }

        .input-box {
            max-width: min(850px, 98%);
            width: 100%;
            background-color: var(--input-bg);
            border-radius: 28px;
            display: flex;
            align-items: center;
            padding: clamp(4px, 0.8vh, 10px) clamp(10px, 1.5vw, 18px);
            border: 1px solid #444;
            gap: 8px;
        }

        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: var(--font-base);
            resize: none;
            outline: none;
            max-height: 120px;
            padding: 6px 0;
            line-height: 1.4;
        }

        .send-btn {
            background-color: var(--accent-color);
            color: #131314;
            border: none;
            width: clamp(32px, 2.8vw, 46px);
            height: clamp(32px, 2.8vw, 46px);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: var(--font-base);
            flex-shrink: 0;
            transition: opacity 0.2s, transform 0.1s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        /* =========================================================
           1. SMARTWATCHES E TELAS ULTRA-PEQUENAS (até 320px)
           ========================================================= */
        @media (max-width: 320px) {
            .sidebar, .avatar {
                display: none !important; /* Libera 100% da tela para o texto */
            }
            .chat-header {
                padding: 8px 10px;
                justify-content: center;
                gap: 8px;
            }
            .chat-messages {
                padding: 8px;
                gap: 8px;
            }
            .message {
                max-width: 100%;
            }
            .message-content {
                padding: 8px 10px;
                border-radius: 10px;
                font-size: 0.78rem;
            }
            .message.user .message-content {
                max-width: 92%;
            }
            .input-container {
                padding: 6px;
            }
            .input-box {
                padding: 4px 8px;
                border-radius: 18px;
            }
            .input-box textarea {
                font-size: 0.78rem;
                padding: 4px 0;
            }
            .send-btn {
                width: 28px;
                height: 28px;
            }
        }

        /* =========================================================
           2. CELULARES E TABLETS RETRATO (321px até 820px)
           ========================================================= */
        @media (min-width: 321px) and (max-width: 820px) {
            .sidebar {
                display: none;
            }
            .message {
                max-width: 100%;
            }
        }

        /* =========================================================
           3. SMART TVs E TELAS GRANDES 4K (acima de 1600px)
           ========================================================= */
        @media (min-width: 1600px) {
            .message, .input-box {
                max-width: 1200px;
            }
            .chat-messages {
                padding: 36px 48px;
                gap: 28px;
            }
            .message-content {
                padding: 22px 28px;
                border-radius: 18px;
            }
            .input-box {
                padding: 12px 24px;
                border-radius: 36px;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="new-chat-btn" onclick="location.reload()">+ Novo Chat</button>
        <div class="sidebar-title">Histórico Recente</div>
        <div style="font-size: calc(var(--font-base) * 0.85); color: var(--text-secondary); padding: 5px;">Projeto Integrado II</div>
    </div>

    <div class="main-container">
        <div class="chat-header">
            <span>Chronical AI</span>
            <button class="clear-btn" onclick="location.reload()">Limpar</button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="avatar bot-avatar">C</div>
                <div class="message-content">Olá, João! Eu sou a <strong>Chronical</strong>, sua inteligência artificial desenvolvida para o seu Projeto Integrado II. Como posso ajudar hoje?</div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" rows="1" placeholder="Mensagem..."></textarea>
                <button class="send-btn" id="sendBtn" aria-label="Enviar">↑</button>
            </div>
        </div>
    </div>

    <script>
        const k1 = "AQ.Ab8RN6KSknbzMLTioeXA";
        const k2 = "-hTIQ2MZfu20Sp49V7_bSNyJgMsIbQ";
        const API_KEY = k1 + k2;

        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        let chatHistory = [];

        // Auto-ajuste da altura do campo de texto conforme digita
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        function formatText(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>');
        }

        function addMessage(text, sender, id = null) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            if (id) messageDiv.id = id;

            const formatted = sender === 'bot' ? formatText(text) : text;

            if (sender === 'bot') {
                messageDiv.innerHTML = `
                    <div class="avatar bot-avatar">C</div>
                    <div class="message-content">${formatted}</div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="message-content">${formatted}</div>
                `;
            }

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';

            const loadingId = 'loading-' + Date.now();
            addMessage('A pensar...', 'bot', loadingId);

            chatHistory.push({
                role: "user",
                parts: [{ text: text }]
            });

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        systemInstruction: {
                            parts: [{ text: "Você é a Chronical, uma assistente virtual inteligente, clara e prestativa, desenvolvida por João como um projeto académico de Análise e Desenvolvimento de Sistemas (Projeto Integrado II)." }]
                        },
                        contents: chatHistory
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId)?.remove();

                if (data.error) {
                    addMessage(`Erro da API: ${data.error.message}`, 'bot');
                    chatHistory.pop();
                    return;
                }

                const botReply = data.candidates[0].content.parts[0].text;
                addMessage(botReply, 'bot');

                chatHistory.push({
                    role: "model",
                    parts: [{ text: botReply }]
                });

            } catch (error) {
                document.getElementById(loadingId)?.remove();
                addMessage('Erro de ligação. Verifique a sua internet.', 'bot');
                chatHistory.pop();
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
