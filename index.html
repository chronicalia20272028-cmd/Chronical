<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Chronical AI</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ececec;
            --text-muted: #8e8ea0;
            --user-text-color: #8ab4f8;
            --accent-color: #8ab4f8;
            --font-base: clamp(0.88rem, 1vw + 0.5rem, 1.3rem);
            --font-header: clamp(1rem, 1.2vw + 0.6rem, 1.55rem);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        button:focus-visible, textarea:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        .main-container {
            width: 100%;
            max-width: 920px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--bg-color);
        }

        .chat-header {
            padding: clamp(14px, 1.8vh, 24px) clamp(16px, 2vw, 28px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .brand-title {
            font-size: var(--font-header);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, #8ab4f8, #c58af9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .clear-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: calc(var(--font-base) * 0.8);
            cursor: pointer;
            transition: color 0.2s, background 0.2s;
        }

        .clear-btn:hover {
            background-color: #121214;
            color: var(--text-color);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: clamp(12px, 2vw, 28px) clamp(16px, 2vw, 28px);
            display: flex;
            flex-direction: column;
            gap: clamp(18px, 2.2vh, 28px);
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #222;
            border-radius: 10px;
        }

        .message {
            max-width: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            line-height: 1.65;
            font-size: var(--font-base);
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-items: flex-end;
        }

        .message.bot {
            align-items: flex-start;
        }

        .message-content {
            background: transparent;
            padding: 0;
            width: 100%;
            word-wrap: break-word;
            overflow-wrap: anywhere;
        }

        .message.user .message-content {
            color: var(--user-text-color);
            max-width: 85%;
            width: auto;
            text-align: right;
            font-weight: 500;
        }

        .message-content p {
            margin-bottom: 0.75em;
        }
        .message-content p:last-child {
            margin-bottom: 0;
        }

        .input-container {
            width: 100%;
            background-color: var(--bg-color);
            padding: clamp(10px, 1.5vh, 20px) clamp(16px, 2vw, 28px);
            padding-bottom: max(clamp(12px, 1.8vh, 22px), env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            flex-shrink: 0;
        }

        .input-box {
            width: 100%;
            background-color: transparent;
            display: flex;
            align-items: flex-end;
            padding: 0;
            border: none;
            gap: 12px;
        }

        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: var(--font-base);
            resize: none;
            outline: none;
            max-height: 140px;
            padding: 8px 0;
            line-height: 1.45;
        }

        .input-box textarea::placeholder {
            color: #5e5e66;
        }

        .send-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            width: clamp(34px, 2.8vw, 44px);
            height: clamp(34px, 2.8vw, 44px);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: var(--font-base);
            flex-shrink: 0;
            transition: opacity 0.2s, transform 0.1s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        .send-btn:active {
            transform: scale(0.94);
        }

        @media (max-width: 320px) {
            .chat-header { padding: 8px 10px; }
            .chat-messages { padding: 8px 10px; gap: 12px; }
            .message-content { font-size: 0.8rem; }
            .input-container { padding: 6px 10px; }
            .input-box textarea { font-size: 0.8rem; padding: 4px 0; }
            .send-btn { width: 28px; height: 28px; }
        }

        @media (min-width: 1600px) {
            .main-container { max-width: 1200px; }
            .chat-messages { padding: 36px 48px; gap: 30px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="chat-header">
            <span class="brand-title">Chronical AI</span>
            <button class="clear-btn" onclick="resetChat()">Nova conversa</button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-content">Olá, João! Sou a <strong>Chronical</strong>. Posso ajudar você a criar códigos, escrever textos, resolver problemas ou explorar qualquer ideia hoje. Por onde começamos?</div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" rows="1" placeholder="Pergunte qualquer coisa à Chronical..."></textarea>
                <button class="send-btn" id="sendBtn" aria-label="Enviar">↑</button>
            </div>
        </div>
    </div>

    <script>
        const k1 = "AQ.Ab8RN6KSknbzMLTioeXA";
        const k2 = "-hTIQ2MZfu20Sp49V7_bSNyJgMsIbQ";
        const API_KEY = k1 + k2;

        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        let chatHistory = [];

        const systemPrompt = "Você é a Chronical, uma inteligência artificial moderna, versátil, perspicaz e avançada, criada por João. Você atua no mesmo nível de excelência de assistentes como Gemini e ChatGPT, ajudando em programação, escrita, análise, criatividade e dúvidas do cotidiano. Estamos em novembro de 2026. Responda em português de forma clara, bem estruturada e natural.";

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 140) + 'px';
        });

        function resetChat() {
            chatHistory = [];
            chatMessages.innerHTML = `
                <div class="message bot">
                    <div class="message-content">Conversa reiniciada. Como a <strong>Chronical</strong> pode ajudar agora, João?</div>
                </div>
            `;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        function addMessage(text, sender, id = null, isThinking = false) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            if (id) messageDiv.id = id;

            const safeText = escapeHtml(text).replace(/\n/g, '<br>');
            if (isThinking) {
                messageDiv.innerHTML = `<div class="message-content" style="color: var(--text-muted); font-style: italic;">${text}</div>`;
            } else {
                messageDiv.innerHTML = `<div class="message-content">${safeText}</div>`;
            }

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageDiv;
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';

            const loadingId = 'loading-' + Date.now();
            addMessage('Chronical está pensando...', 'bot', loadingId, true);

            chatHistory.push({
                role: "user",
                parts: [{ text: text }]
            });

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        systemInstruction: {
                            parts: [{ text: systemPrompt }]
                        },
                        contents: chatHistory
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId)?.remove();

                if (data.error) {
                    addMessage(`Erro da API: ${data.error.message}`, 'bot');
                    chatHistory.pop();
                    return;
                }

                const botReply = data.candidates[0].content.parts[0].text;
                addMessage(botReply, 'bot');

                chatHistory.push({
                    role: "model",
                    parts: [{ text: botReply }]
                });

            } catch (error) {
                document.getElementById(loadingId)?.remove();
                addMessage('Erro de conexão. Verifique sua internet e tente novamente.', 'bot');
                chatHistory.pop();
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
