<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Chronical - Assistente de IA</title>
    <style>
        :root {
            --bg-color: #000000;
            --container-bg: #000000;
            --input-bg: #161618;
            --text-color: #e3e3e3;
            --user-text-color: #8ab4f8;
            --accent-color: #8ab4f8;
            --font-base: clamp(0.85rem, 1vw + 0.5rem, 1.35rem);
            --font-header: clamp(0.95rem, 1.2vw + 0.6rem, 1.6rem);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        button:focus-visible, textarea:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        .main-container {
            width: 100%;
            max-width: 950px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--container-bg);
        }

        .chat-header {
            padding: clamp(12px, 1.5vh, 22px) clamp(16px, 2vw, 28px);
            font-size: var(--font-header);
            font-weight: 600;
            border: none;
            background-color: var(--bg-color);
            color: var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .clear-btn {
            background-color: #161618;
            border: none;
            color: var(--text-color);
            padding: clamp(6px, 0.6vh, 8px) clamp(12px, 1.2vw, 18px);
            border-radius: 16px;
            font-size: calc(var(--font-base) * 0.8);
            cursor: pointer;
            transition: background 0.2s;
        }

        .clear-btn:hover {
            background-color: #252528;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: clamp(15px, 2vw, 30px);
            display: flex;
            flex-direction: column;
            gap: clamp(16px, 2vh, 26px);
            scroll-behavior: smooth;
        }

        .message {
            max-width: min(850px, 100%);
            margin: 0 auto;
            width: 100%;
            display: flex;
            line-height: 1.6;
            font-size: var(--font-base);
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            background: transparent;
            padding: 0;
            border-radius: 0;
            width: 100%;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            border: none;
        }

        .message.user .message-content {
            background: transparent;
            color: var(--user-text-color);
            padding: 0;
            max-width: 85%;
            width: auto;
            text-align: right;
            border: none;
        }

        .input-container {
            width: 100%;
            background-color: var(--bg-color);
            padding: clamp(10px, 1.5vh, 20px) clamp(16px, 2vw, 28px);
            padding-bottom: max(clamp(10px, 1.5vh, 20px), env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            flex-shrink: 0;
            border: none;
        }

        /* Caixa de input agora sem borda arredondada (border-radius: 0) */
        .input-box {
            max-width: min(850px, 100%);
            width: 100%;
            background-color: var(--input-bg);
            border-radius: 0;
            display: flex;
            align-items: center;
            padding: clamp(8px, 1vh, 12px) clamp(14px, 1.5vw, 20px);
            border: none;
            gap: 10px;
        }

        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: var(--font-base);
            resize: none;
            outline: none;
            max-height: 120px;
            padding: 6px 0;
            line-height: 1.4;
        }

        .send-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            width: clamp(34px, 2.8vw, 46px);
            height: clamp(34px, 2.8vw, 46px);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: var(--font-base);
            flex-shrink: 0;
            transition: opacity 0.2s, transform 0.1s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        @media (max-width: 320px) {
            .chat-header { padding: 8px 10px; justify-content: center; gap: 8px; }
            .chat-messages { padding: 8px; gap: 10px; }
            .message-content { font-size: 0.78rem; }
            .input-container { padding: 6px; }
            .input-box { padding: 6px 10px; border-radius: 0; }
            .input-box textarea { font-size: 0.78rem; }
            .send-btn { width: 28px; height: 28px; }
        }

        @media (min-width: 1600px) {
            .main-container { max-width: 1200px; }
            .chat-messages { padding: 36px 48px; gap: 28px; }
            .input-box { padding: 14px 26px; border-radius: 0; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="chat-header">
            <span>Chronical AI</span>
            <button class="clear-btn" onclick="location.reload()">Limpar</button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-content">Olá, João! Eu sou a <strong>Chronical</strong>, sua inteligência artificial desenvolvida para o seu Projeto Integrado II. Como posso ajudar hoje?</div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" rows="1" placeholder="Mensagem..."></textarea>
                <button class="send-btn" id="sendBtn" aria-label="Enviar">↑</button>
            </div>
        </div>
    </div>

    <script>
        const k1 = "AQ.Ab8RN6KSknbzMLTioeXA";
        const k2 = "-hTIQ2MZfu20Sp49V7_bSNyJgMsIbQ";
        const API_KEY = k1 + k2;

        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        let chatHistory = [];

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        function formatText(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>');
        }

        function addMessage(text, sender, id = null) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            if (id) messageDiv.id = id;

            const formatted = sender === 'bot' ? formatText(text) : text;
            messageDiv.innerHTML = `<div class="message-content">${formatted}</div>`;

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';

            const loadingId = 'loading-' + Date.now();
            addMessage('A pensar...', 'bot', loadingId);

            chatHistory.push({
                role: "user",
                parts: [{ text: text }]
            });

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        systemInstruction: {
                            parts: [{ text: "Você é a Chronical, uma assistente virtual inteligente, clara e prestativa, desenvolvida por João como um projeto académico de Análise e Desenvolvimento de Sistemas (Projeto Integrado II)." }]
                        },
                        contents: chatHistory
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId)?.remove();

                if (data.error) {
                    addMessage(`Erro da API: ${data.error.message}`, 'bot');
                    chatHistory.pop();
                    return;
                }

                const botReply = data.candidates[0].content.parts[0].text;
                addMessage(botReply, 'bot');

                chatHistory.push({
                    role: "model",
                    parts: [{ text: botReply }]
                });

            } catch (error) {
                document.getElementById(loadingId)?.remove();
                addMessage('Erro de ligação. Verifique a sua internet.', 'bot');
                chatHistory.pop();
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
